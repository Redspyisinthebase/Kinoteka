<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineKutak Upgrade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">CineKutak</div>
  <input type="text" id="search" placeholder="Pretraži filmove i serije...">
</header>

<section class="grid" id="grid"></section>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span id="close">&times;</span>
    <img id="mimg">
    <h2 id="mtitle"></h2>
    <button id="favBtn">❤️ Dodaj u favorite</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
